# Build ocaml-light via Nix on Linux and MacOS
# See also shell.nix at the root of the project.

name: nix

on:
  workflow_dispatch: null
  pull_request_target: {}
  push:
    branches: [ master ]

jobs:
  job:
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # pinned (not macos-latest): the nixpkgs channel below is pinned to
          # nixos-24.05, whose Darwin stdenv (cctools-binutils-darwin-wrapper
          # 16.0.6) aborts compiling even trivial C ("Abort trap: 6") on the
          # macOS 26 image that macos-latest now points to. Revisit once
          # nixpkgs ships a Darwin stdenv that supports the newer SDK.
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build Nix shell
        run: nix-shell --pure
      # we don't run 'make install' below to test this target because
      # Nix will prevent access to /usr/local/bin
      - name: Build XiX using Nix
        run: |
          #coupling: Dockerfile
          nix-shell --run '
            ./configure
            make coldstart
            make world
            #TODO: make nix-test
          '

  ubuntu-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix-shell --pure
      - name: Build XiX using Nix
        run: |
          #coupling: Dockerfile
          # claude: configure no longer defaults a 64-bit host's
          # native-code target to a 32-bit cross target, so ask for it
          # explicitly (ubuntu-latest runners are x86_64).
          nix-shell --run '
            ./configure -target-arch i386
            make coldstart
            make world
            make opt
            #TODO: make nix-test
          '
          
