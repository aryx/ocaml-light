# Build ocaml-light via docker, one job per target in parallel.
# See also Dockerfile (and Dockerfile.plan9) at the root of the project.
#
# claude: modeled on ~/xv6-multiarch/.github/workflows/docker.yml's own
# matrix shape. The matrix is what makes this parallel rather than one
# long serial job (as this workflow used to be, one "docker build" step
# per target run one after another): each job builds just its own
# target, so a slow arch (e.g. under qemu-user-static) no longer makes
# every other target wait behind it, and a single arch's failure
# doesn't abort the others (fail-fast: false).
# Add a new target here at the same time it gets its own stage in the
# Dockerfile.

name: docker

on:
  pull_request_target: {}
  workflow_dispatch: null
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: ocaml-light
            target: bytecode
          - tag: ocaml-light-opt
            target: native-x86_64
          # mips runs entirely under qemu-user-static (see Dockerfile), so
          # this works the same on any runner architecture.
          - tag: ocaml-light-mips
            target: native-mips
          # same reasoning as mips above -- alpha also runs entirely
          # under qemu-user-static.
          - tag: ocaml-light-alpha
            target: native-alpha
          # same reasoning as mips/alpha above -- m68k also runs entirely
          # under qemu-user-static.
          - tag: ocaml-light-m68k
            target: native-m68k
          # same reasoning as mips/alpha/m68k above -- sparc also runs
          # entirely under qemu-user-static.
          - tag: ocaml-light-sparc
            target: native-sparc
          # same reasoning as mips/alpha/m68k/sparc above -- power also
          # runs entirely under qemu-user-static.
          - tag: ocaml-light-power
            target: native-power
          # same reasoning as mips/alpha/m68k/sparc/power above -- amd64
          # also runs entirely under qemu-user-static.
          - tag: ocaml-light-amd64
            target: native-amd64
          # same reasoning as mips/alpha/m68k/sparc/power/amd64 above --
          # arm64 also runs entirely under qemu-user-static.
          - tag: ocaml-light-arm64
            target: native-arm64
          # alt: make build-docker-plan9, but requires to run configure
          # first because the toplevel Makefile includes config/Makefile
          # generated by configure, so simpler to duplicate the
          # build-docker-plan9 target here. Uses its own Dockerfile, no
          # --target (single-stage build).
          - tag: ocaml-light-plan9
            dockerfile: Dockerfile.plan9
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker build --tag ${{ matrix.tag }}
          -f ${{ matrix.dockerfile || 'Dockerfile' }}
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          .
