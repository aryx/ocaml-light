# Build ocaml-light via docker.
# See also Dockerfile at the root of the project.

name: docker

on:
  pull_request_target: {}
  workflow_dispatch: null
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag ocaml-light --target bytecode .
      - run: docker build --tag ocaml-light-opt --target native-x86_64 .
      # mips runs entirely under qemu-user-static (see Dockerfile), so this
      # works the same on any runner architecture.
      - run: docker build --tag ocaml-light-mips --target native-mips .
      # same reasoning as mips above -- alpha also runs entirely under
      # qemu-user-static.
      - run: docker build --tag ocaml-light-alpha --target native-alpha .
      # same reasoning as mips/alpha above -- m68k also runs entirely
      # under qemu-user-static.
      - run: docker build --tag ocaml-light-m68k --target native-m68k .
      # same reasoning as mips/alpha/m68k above -- sparc also runs
      # entirely under qemu-user-static.
      - run: docker build --tag ocaml-light-sparc --target native-sparc .
      # same reasoning as mips/alpha/m68k/sparc above -- power also runs
      # entirely under qemu-user-static.
      - run: docker build --tag ocaml-light-power --target native-power .
      # same reasoning as mips/alpha/m68k/sparc/power above -- amd64 also
      # runs entirely under qemu-user-static.
      - run: docker build --tag ocaml-light-amd64 --target native-amd64 .
      # alt: make build-docker-plan9, but requires to run configure first
      # because the toplevel Makefile include config/Makefile generated by configure
      # so simpler to duplicate the build-docker-plan9 target here
      - run: docker build --tag "ocaml-light-plan9" -f Dockerfile.plan9 .
